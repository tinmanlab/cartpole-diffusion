name: Validate interactive lab
on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "index.html"
      - "app/**"
      - "artifacts/**"
      - "training/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python -m unittest training.test_core
      - run: node --check app/tiny_denoiser.js
      - run: node --check app/diffusion_viz.js
      - run: node --check app/control_loop_viz.js
      - run: node tests/index_script_smoke.cjs
      - run: node tests/readability_smoke.cjs
      - name: 3-snapshot latent strip regression (F1 rewrite, no browser needed)
        run: node tests/snapshot_strip_check.cjs
      - name: Browser-model and visualization smoke contract
        if: hashFiles('artifacts/model.json') != ''
        run: node tests/model_smoke.cjs
      - name: Model runtime structure and latency
        if: hashFiles('artifacts/model.json') != ''
        run: node tests/model_runtime_check.cjs
      - name: Ten-second learned-policy rollout
        if: hashFiles('artifacts/model.json') != ''
        run: node tests/live_policy_smoke.cjs
      - name: Deterministic three-seed comparison replay
        if: hashFiles('artifacts/model.json') != ''
        run: node tests/comparison_replay_check.cjs

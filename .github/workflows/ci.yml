name: Validate interactive lab
on:
  pull_request:
  push:
    branches: [feat/v0.2-learned-denoiser, main]
    paths:
      - "index.html"
      - "app/**"
      - "artifacts/**"
      - "training/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python -m unittest training.test_core
      - run: node --check app/tiny_denoiser.js
      - name: Browser-model smoke contract
        if: hashFiles('artifacts/model.json') != ''
        run: node tests/model_smoke.cjs

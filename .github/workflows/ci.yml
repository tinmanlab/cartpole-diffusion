name: Validate interactive lab
on:
  pull_request:
  push:
    branches: [feat/v0.2-learned-denoiser, feat/v0.3-diffusion-focus, feat/v0.4-responsive-live-layout, feat/v0.5-beginner-distribution-view, feat/v0.6-control-loop-first, feat/v0.7-readability, main]
    paths:
      - "index.html"
      - "app/**"
      - "artifacts/**"
      - "training/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python -m unittest training.test_core
      - run: node --check app/tiny_denoiser.js
      - run: node --check app/diffusion_viz.js
      - run: node --check app/control_loop_viz.js
      - run: node tests/index_script_smoke.cjs
      - name: Browser-model and visualization smoke contract
        if: hashFiles('artifacts/model.json') != ''
        run: node tests/model_smoke.cjs
      - name: Ten-second learned-policy rollout
        if: hashFiles('artifacts/model.json') != ''
        run: node tests/live_policy_smoke.cjs

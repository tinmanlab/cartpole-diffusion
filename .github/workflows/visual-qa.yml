name: Browser Visual QA

on:
  pull_request:
    paths:
      - "index.html"
      - "app/**"
      - "artifacts/**"
      - "tests/visual_qa.mjs"
      - "tests/conditioning_experiment.cjs"
      - "tests/terminal_gate_check.mjs"
      - ".github/workflows/visual-qa.yml"
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "index.html"
      - "app/**"
      - "artifacts/**"
      - "tests/visual_qa.mjs"
      - "tests/conditioning_experiment.cjs"
      - "tests/terminal_gate_check.mjs"
      - ".github/workflows/visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start deployed-shape static preview
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/cartpole-diffusion-preview.log 2>&1 &
          echo $! > /tmp/cartpole-diffusion-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cartpole-diffusion-preview.log
          exit 1
      - name: Run browser visual and interaction QA
        run: node tests/visual_qa.mjs
      - name: Verify captured single-input experiment
        run: node tests/conditioning_experiment.cjs
      - name: Verify guide/live shared terminal gate (F1 regression)
        run: node tests/terminal_gate_check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cartpole-diffusion-visual-qa
          path: qa-output/
          retention-days: 14

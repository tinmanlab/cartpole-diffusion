name: Train v0.2 denoiser
on:
  push:
    branches: [feat/v0.2-learned-denoiser]
    paths:
      - "training/**"
      - ".github/workflows/train-v02.yml"
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.2-learned-denoiser
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python -m unittest training.test_core
      - run: python -m training.train_denoiser
      - name: Commit deterministic trained artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/
          if ! git diff --cached --quiet; then
            git commit -m "Add trained v0.2 denoiser artifacts"
            git push origin HEAD:feat/v0.2-learned-denoiser
          fi
